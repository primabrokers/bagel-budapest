<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Zoom stays LOCKED deliberately: this is installed as an app, and allowing pinch-zoom
         would drift any fixed chrome out of place while scrolling. Layouts are built to work
         at phone width instead of relying on the user zooming out. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#4A2545" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bar Mitzvah Planner" />
    <link rel="manifest" href="/manifest.json" />
    <title>Bar Mitzvah Planner</title>
  </head>
  <body>
    <!-- Launch shell. Paints as soon as the HTML parses, needs no JS and no network; #root's
         first render covers it (it sits BEHIND #root, and is removed on mount by main.tsx). -->
    <div id="boot-shell" aria-hidden="true"></div>
    <style>
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #F6F1EA;
      }
      #root { position: relative; z-index: 1; }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
