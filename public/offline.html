<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4A2545" />
    <title>You're offline — Bar Mitzvah Planner</title>
    <style>
      /* Zero external CSS/JS/fonts on purpose — this page has to render with no network at all,
         so it can't depend on anything sw.js would otherwise need to fetch. */
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #F6F1EA;
        color: #271325;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 320px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: #4A2545;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark svg { width: 30px; height: 30px; }
      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #5B4A56;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: #4A2545;
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:active { background: #381C35; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,10 68,40 90,40 71,55 78,80 50,65 22,80 29,55 10,40 32,40" fill="#D1AF61" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>The Bar Mitzvah Planner needs a connection to load this page. Check your signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
